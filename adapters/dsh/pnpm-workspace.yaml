packages:
  - npm/*

# pnpm 11 reads package-manager settings here, not from package.json.
# koffi (@deepseek-ai/dsh-fs-local's native dep) ships prebuilt platform
# binaries, so its postinstall fallback build is deliberately not run.
# dsh-subprocess-local's postinstall only fixes node-pty's prebuilt
# spawn-helper exec bit, and node-pty is only required for terminal
# features; neither build is needed by the adapter or its tests.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  koffi: false
  node-pty: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.0-rc.1 || 0.2.0-rc.2 || 0.2.1-alpha.1 || 0.2.1-alpha.2'
