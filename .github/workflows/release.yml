name: Release

run-name: Release ${{ inputs.commit_sha }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA from main to release
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate dispatch context
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "release workflow must be dispatched from main, got $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character hexadecimal commit SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Runner preflight
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc -vV
          echo "uname -s=$(uname -s)"
          echo "uname -m=$(uname -m)"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "${RUNNER_ARCH}" = X64
      - id: release
        name: Validate commit, version, tag, and CI
        shell: bash
        env:
          COMMIT_SHA_INPUT: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          commit_sha="$(git rev-parse HEAD^{commit})"
          if [[ "$commit_sha" != "${COMMIT_SHA_INPUT,,}" ]]; then
            echo "checkout resolved to $commit_sha; expected $COMMIT_SHA_INPUT" >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$commit_sha" refs/remotes/origin/main; then
            echo "commit $commit_sha is not reachable from origin/main" >&2
            exit 1
          fi

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          version="$(jq -er '
            [.packages[] | select(.name == "codexshim")] |
            if length == 1 then .[0].version
            else error("expected exactly one codexshim package")
            end
          ' <<<"$metadata")"
          tag="v$version"

          if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            echo "remote tag $tag already exists" >&2
            exit 1
          fi

          runs="$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$commit_sha" \
            -f status=success \
            -f per_page=100)"
          if ! ci_url="$(jq -er --arg sha "$commit_sha" '
            .workflow_runs
            | map(select(
                .head_sha == $sha
                and .head_branch == "main"
                and .event == "push"
                and .status == "completed"
                and .conclusion == "success"
              ))
            | first
            | .html_url
          ' <<<"$runs")"; then
            echo "commit $commit_sha has no successful completed CI push run on main" >&2
            exit 1
          fi

          echo "validated CI run: $ci_url"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.target }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            system: Linux
            machine: x86_64
            runner_arch: X64
            target: x86_64-unknown-linux-gnu
            binary: codexshim
            config: config/codex.linux.toml.example
            format: tar.gz
          - os: ubuntu-24.04-arm
            platform: linux
            system: Linux
            machine: aarch64
            runner_arch: ARM64
            target: aarch64-unknown-linux-gnu
            binary: codexshim
            config: config/codex.linux.toml.example
            format: tar.gz
          - os: macos-26
            platform: macos
            system: Darwin
            machine: arm64
            runner_arch: ARM64
            target: aarch64-apple-darwin
            binary: codexshim
            config: config/codex.macos.toml.example
            format: tar.gz
          - os: windows-2025
            platform: windows
            os_architecture: X64
            runner_arch: X64
            target: x86_64-pc-windows-msvc
            binary: codexshim.exe
            config: config/codex.windows.toml.example
            format: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: "false"
      - name: Unix runner preflight
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc -vV
          echo "uname -s=$(uname -s)"
          echo "uname -m=$(uname -m)"
          test "$(uname -s)" = "${{ matrix.system }}"
          test "$(uname -m)" = "${{ matrix.machine }}"
          test "${RUNNER_ARCH}" = "${{ matrix.runner_arch }}"
      - name: Windows runner preflight
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc -vV
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          Write-Host "RuntimeInformation.OSArchitecture=$architecture"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          if ($architecture -ne "${{ matrix.os_architecture }}" -or $env:RUNNER_ARCH -ne "${{ matrix.runner_arch }}") {
              throw "Runner architecture does not match the Windows package target"
          }
      - name: Install native release target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify Unix release binary version
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          expected="codexshim ${{ needs.preflight.outputs.version }}"
          actual="$(./target/${{ matrix.target }}/release/${{ matrix.binary }} --version)"
          if [[ "$actual" != "$expected" ]]; then
            echo "release binary reported '$actual'; expected '$expected'" >&2
            exit 1
          fi
      - name: Verify Windows release binary version
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $expected = "codexshim ${{ needs.preflight.outputs.version }}"
          $binary = (Resolve-Path "target/${{ matrix.target }}/release/${{ matrix.binary }}").Path
          $actual = (& $binary --version | Out-String).Trim()
          if ($actual -cne $expected) {
            throw "Release binary reported '$actual'; expected '$expected'."
          }
      - name: Stage Unix archive contents
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          name="codexshim-${{ needs.preflight.outputs.version }}-${{ matrix.target }}"
          stage="dist/$name"
          mkdir -p "$stage/config"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$stage/"
          cp README.md LICENSE "$stage/"
          cp config/AGENTS.codexshim.md config/codex.linux.toml.example config/codex.windows.toml.example "$stage/config/"
          if [[ "${{ matrix.platform }}" == macos ]]; then
            cp config/codex.macos.toml.example "$stage/config/"
          fi
          cp "${{ matrix.config }}" "$stage/codex.toml.example"
          expected_manifest="$(printf '%s\n' \
            LICENSE \
            README.md \
            codex.toml.example \
            "${{ matrix.binary }}" \
            config/AGENTS.codexshim.md \
            config/codex.linux.toml.example \
            config/codex.windows.toml.example
          )"
          if [[ "${{ matrix.platform }}" == macos ]]; then
            expected_manifest+=$'\nconfig/codex.macos.toml.example'
          fi
          expected_manifest="$(printf '%s\n' "$expected_manifest" | LC_ALL=C sort)"
          actual_manifest="$(LC_ALL=C find "$stage" -type f -print | sed "s#^$stage/##" | LC_ALL=C sort)"
          if [[ "$actual_manifest" != "$expected_manifest" ]]; then
            printf 'unexpected Unix archive manifest:\n%s\n' "$actual_manifest" >&2
            exit 1
          fi
      - name: Stage Windows archive contents
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $name = "codexshim-${{ needs.preflight.outputs.version }}-${{ matrix.target }}"
          $stage = Join-Path "dist" $name
          $configStage = Join-Path $stage "config"
          New-Item -ItemType Directory -Force $configStage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" $stage
          Copy-Item README.md, LICENSE $stage
          Copy-Item config/AGENTS.codexshim.md, config/codex.linux.toml.example, config/codex.windows.toml.example $configStage
          Copy-Item "${{ matrix.config }}" (Join-Path $stage "codex.toml.example")
          $stagePath = (Resolve-Path $stage).Path
          $expected = @(
              "LICENSE",
              "README.md",
              "codex.toml.example",
              "${{ matrix.binary }}",
              "config/AGENTS.codexshim.md",
              "config/codex.linux.toml.example",
              "config/codex.windows.toml.example"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath $stagePath -File -Recurse | ForEach-Object {
              $_.FullName.Substring($stagePath.Length + 1).Replace('\', '/')
          } | Sort-Object)
          if (@(Compare-Object $expected $actual).Count -ne 0) {
              throw "Unexpected Windows archive manifest: $($actual -join ', ')"
          }
      - name: Create Windows archive
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $name = "codexshim-${{ needs.preflight.outputs.version }}-${{ matrix.target }}"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $archive = "dist/$name.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
          try {
              $actual = @($zip.Entries | Where-Object { $_.Length -gt 0 } | ForEach-Object {
                  $_.FullName.Substring($name.Length + 1)
              } | Sort-Object)
          } finally {
              $zip.Dispose()
          }
          $expected = @(
              "LICENSE",
              "README.md",
              "codex.toml.example",
              "${{ matrix.binary }}",
              "config/AGENTS.codexshim.md",
              "config/codex.linux.toml.example",
              "config/codex.windows.toml.example"
          ) | Sort-Object
          if (@(Compare-Object $expected $actual).Count -ne 0) {
              throw "Unexpected Windows archive manifest: $($actual -join ', ')"
          }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Out-File -FilePath "$archive.sha256" -Encoding ascii
      - name: Create Unix archive
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          name="codexshim-${{ needs.preflight.outputs.version }}-${{ matrix.target }}"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          expected_manifest="$(tar -tzf "dist/$name.tar.gz" | sed "s#^$name/##" | sed '/\/$/d' | LC_ALL=C sort)"
          stage_manifest="$(LC_ALL=C find "dist/$name" -type f -print | sed "s#^dist/$name/##" | LC_ALL=C sort)"
          if [[ "$expected_manifest" != "$stage_manifest" ]]; then
            printf 'unexpected Unix archive manifest:\n%s\n' "$expected_manifest" >&2
            exit 1
          fi
          if [[ "${{ matrix.platform }}" == macos ]]; then
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          else
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
      - name: Test Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/test-install-windows.ps1 -ExpectedVersion "${{ needs.preflight.outputs.version }}" -ReleaseDirectory (Resolve-Path dist).Path
      - name: Test Unix installer
        if: matrix.platform != 'windows'
        shell: bash
        run: sh scripts/test-install-linux.sh "$PWD/dist" "${{ needs.preflight.outputs.version }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codexshim-${{ matrix.target }}
          path: |
            dist/*.${{ matrix.format }}
            dist/*.${{ matrix.format }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: codexshim-*
          merge-multiple: true
      - name: Validate packaged assets
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            "codexshim-$VERSION-aarch64-apple-darwin.tar.gz" \
            "codexshim-$VERSION-aarch64-apple-darwin.tar.gz.sha256" \
            "codexshim-$VERSION-aarch64-unknown-linux-gnu.tar.gz" \
            "codexshim-$VERSION-aarch64-unknown-linux-gnu.tar.gz.sha256" \
            "codexshim-$VERSION-x86_64-pc-windows-msvc.zip" \
            "codexshim-$VERSION-x86_64-pc-windows-msvc.zip.sha256" \
            "codexshim-$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            "codexshim-$VERSION-x86_64-unknown-linux-gnu.tar.gz.sha256" |
            LC_ALL=C sort
          )"
          actual="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected packaged assets:\n%s\n' "$actual" >&2
            exit 1
          fi
      - name: Generate global assets
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum \
              "codexshim-$VERSION-aarch64-apple-darwin.tar.gz" \
              "codexshim-$VERSION-aarch64-unknown-linux-gnu.tar.gz" \
              "codexshim-$VERSION-x86_64-pc-windows-msvc.zip" \
              "codexshim-$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
              > SHA256SUMS
          )
          sh -n scripts/install.sh
          sed "s|^default_version=\"\" # @codexshim:default-version|default_version=\"$VERSION\" # @codexshim:default-version|" scripts/install.sh > dist/install.sh
          sed "s|^\$DefaultVersion = \"\" # @codexshim:default-version|\$DefaultVersion = \"$VERSION\" # @codexshim:default-version|" scripts/install.ps1 > dist/install.ps1
          chmod 755 dist/install.sh
          sh -n dist/install.sh
          grep -q "^default_version=\"$VERSION\" # @codexshim:default-version" dist/install.sh
          grep -q "^\$DefaultVersion = \"$VERSION\" # @codexshim:default-version" dist/install.ps1
      - name: Validate final release assets
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            SHA256SUMS \
            "codexshim-$VERSION-aarch64-apple-darwin.tar.gz" \
            "codexshim-$VERSION-aarch64-apple-darwin.tar.gz.sha256" \
            "codexshim-$VERSION-aarch64-unknown-linux-gnu.tar.gz" \
            "codexshim-$VERSION-aarch64-unknown-linux-gnu.tar.gz.sha256" \
            "codexshim-$VERSION-x86_64-pc-windows-msvc.zip" \
            "codexshim-$VERSION-x86_64-pc-windows-msvc.zip.sha256" \
            "codexshim-$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            "codexshim-$VERSION-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            install.ps1 \
            install.sh |
            LC_ALL=C sort
          )"
          actual="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'unexpected final release assets:\n%s\n' "$actual" >&2
            exit 1
          fi
      - name: Create GitHub release
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]]; then
            echo "remote tag $TAG appeared after preflight" >&2
            exit 1
          fi

          cleanup_failed_release() {
            local ref_json ref_sha ref_type releases release_count is_draft
            if ! ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" 2>/dev/null)"; then
              echo "no tag was created; no release cleanup is needed" >&2
              return
            fi
            ref_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            ref_type="$(jq -r '.object.type' <<<"$ref_json")"
            if [[ "$ref_type" != commit || "$ref_sha" != "$COMMIT_SHA" ]]; then
              echo "ref $TAG does not identify this release commit; refusing cleanup" >&2
              return
            fi
            if ! releases="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/releases" -f per_page=100)"; then
              echo "could not inspect releases; refusing cleanup" >&2
              return
            fi
            release_count="$(jq --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | length' <<<"$releases")"
            if [[ "$release_count" == 0 ]]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$TAG"
              echo "removed tag-only residue for $TAG" >&2
              return
            fi
            if [[ "$release_count" != 1 ]]; then
              echo "unexpected release count for $TAG; refusing cleanup" >&2
              return
            fi
            is_draft="$(jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .draft' <<<"$releases")"
            if [[ "$is_draft" != true ]]; then
              echo "release $TAG is already published; refusing cleanup" >&2
              return
            fi
            gh release delete "$TAG" --cleanup-tag --yes
            echo "removed failed draft release and tag $TAG" >&2
          }

          release_args=(
            "$TAG"
            dist/*
            --target "$COMMIT_SHA"
            --generate-notes
            --title "$TAG"
          )
          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          if ! gh release create "${release_args[@]}"; then
            cleanup_failed_release
            exit 1
          fi
      - name: Verify published release
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")"
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG")"
          expected_assets="$(printf '%s\n' \
            SHA256SUMS \
            "codexshim-$VERSION-aarch64-apple-darwin.tar.gz" \
            "codexshim-$VERSION-aarch64-apple-darwin.tar.gz.sha256" \
            "codexshim-$VERSION-aarch64-unknown-linux-gnu.tar.gz" \
            "codexshim-$VERSION-aarch64-unknown-linux-gnu.tar.gz.sha256" \
            "codexshim-$VERSION-x86_64-pc-windows-msvc.zip" \
            "codexshim-$VERSION-x86_64-pc-windows-msvc.zip.sha256" \
            "codexshim-$VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            "codexshim-$VERSION-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            install.ps1 \
            install.sh |
            LC_ALL=C sort
          )"
          actual_assets="$(jq -r '.assets[].name' <<<"$release" | LC_ALL=C sort)"
          expected_prerelease=false
          if [[ "$VERSION" == *-* ]]; then
            expected_prerelease=true
          fi
          jq -e \
            --arg sha "$COMMIT_SHA" \
            --arg tag "$TAG" \
            --argjson prerelease "$expected_prerelease" \
            '.tag_name == $tag
              and .target_commitish == $sha
              and .draft == false
              and .prerelease == $prerelease' \
            <<<"$release" >/dev/null
          jq -e \
            --arg sha "$COMMIT_SHA" \
            '.object.type == "commit" and .object.sha == $sha' \
            <<<"$ref" >/dev/null
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            printf 'unexpected published assets:\n%s\n' "$actual_assets" >&2
            exit 1
          fi
