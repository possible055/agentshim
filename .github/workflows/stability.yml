name: Stability

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 3"

permissions:
  contents: read

concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  root-lib:
    name: Windows x86-64 stability
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Default test threads pass 1
        run: cargo test --locked -p agentshim --lib --all-features
      - name: Default test threads pass 2
        run: cargo test --locked -p agentshim --lib --all-features
      - name: Default test threads pass 3
        run: cargo test --locked -p agentshim --lib --all-features
      - name: Two test threads
        run: cargo test --locked -p agentshim --lib --all-features -- --test-threads 2
      - name: One test thread
        run: cargo test --locked -p agentshim --lib --all-features -- --test-threads 1
