name: Performance benchmark

on:
  workflow_dispatch:
    inputs:
      scales:
        description: Comma-separated fixture sizes (1000, 100000, 1000000)
        required: false
        default: "1000"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-11-ntfs:
    runs-on: [self-hosted, Windows, X64, agentshim-windows11-ntfs]
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: target/performance
      AGENTSHIM_BENCH_COMMIT: ${{ github.sha }}
      AGENTSHIM_BENCH_WORKTREE: github-actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/performance"
          cache-bin: "false"
      - name: Benchmark repository tools
        env:
          AGENTSHIM_BENCH_SCALES: ${{ inputs.scales }}
          AGENTSHIM_BENCH_MAX_GLOB_P95_MS_PER_1K: "250"
          AGENTSHIM_BENCH_MAX_GREP_P95_MS_PER_1K: "2000"
          AGENTSHIM_BENCH_MAX_READ_P95_MS: "10"
        run: cargo bench --locked --features bench-internals --bench performance
      - name: Benchmark diagnostics through stdio
        env:
          AGENTSHIM_BENCH_MAX_STDIO_COLD_MS: "750"
          AGENTSHIM_BENCH_MAX_STDIO_P95_MS: "10"
          AGENTSHIM_BENCH_MAX_PROCESS_MS: "300"
        run: cargo bench --locked --bench stdio_performance
