name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Windows x86-64 CI
    uses: ./.github/workflows/rust-validation.yml
    with:
      runner: windows-2025
      platform: windows
      runner_arch: X64
      os_architecture: X64
      setup_node: false
      run_format: true
      build_docs: true
      run_metadata: true

  linux-engine-validation:
    name: Linux x86-64 Core/NAPI CI
    uses: ./.github/workflows/rust-validation.yml
    with:
      runner: ubuntu-24.04
      platform: unix
      system: Linux
      machine: x86_64
      runner_arch: X64
      engine_only: true
