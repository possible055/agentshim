name: Rust validation

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      system:
        required: false
        type: string
        default: ""
      machine:
        required: false
        type: string
        default: ""
      runner_arch:
        required: true
        type: string
      os_architecture:
        required: false
        type: string
        default: ""
      setup_node:
        required: false
        type: boolean
        default: false
      run_format:
        required: false
        type: boolean
        default: false
      build_docs:
        required: false
        type: boolean
        default: false
      run_metadata:
        required: false
        type: boolean
        default: false
      deny_test_warnings:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ${{ inputs.deny_test_warnings && '-Dwarnings' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine validation scope
        id: validation-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          scope=full
          reason="manual or unsupported event"
          base_sha=""

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PULL_REQUEST_BASE_SHA"
              ;;
            push)
              reason="push events always run full validation"
              ;;
          esac

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$base_sha" =~ ^[0-9a-fA-F]{40}$ || "$base_sha" =~ ^0{40}$ ]]; then
              reason="base commit is unavailable; using full validation"
            elif [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              reason="head commit is invalid; using full validation"
            else
              if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
                if ! git fetch --no-tags --depth=1 origin "$base_sha"; then
                  reason="base commit fetch failed; using full validation"
                  base_sha=""
                fi
              fi

              if [[ -n "$base_sha" ]]; then
                set +e
                git diff --quiet "$base_sha" "$HEAD_SHA" -- \
                  crates/pdf-read-core \
                  crates/gigatoken-core \
                  Cargo.toml \
                  Cargo.lock \
                  rust-toolchain.toml \
                  .gitattributes \
                  .cargo \
                  .github/workflows/ci.yml \
                  .github/workflows/optional-platform-ci.yml \
                  .github/workflows/rust-validation.yml
                diff_status=$?
                set -e

                case "$diff_status" in
                  0)
                    scope=root
                    reason="no derivative validation inputs changed"
                    ;;
                  1)
                    reason="derivative validation inputs changed"
                    ;;
                  *)
                    reason="change detection failed; using full validation"
                    ;;
                esac
              fi
            fi
          fi

          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          {
            printf '### Validation scope\n\n'
            printf -- '- Scope: `%s`\n' "$scope"
            printf -- '- Reason: %s\n' "$reason"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: inputs.setup_node
        with:
          node-version: "24"
      - name: Unix runner preflight
        if: inputs.platform == 'unix'
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc -vV
          test "$(uname -s)" = "${{ inputs.system }}"
          test "$(uname -m)" = "${{ inputs.machine }}"
          test "${RUNNER_ARCH}" = "${{ inputs.runner_arch }}"
      - name: Windows runner preflight
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc -vV
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          Write-Host "RuntimeInformation.OSArchitecture=$architecture"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          if ($architecture -ne "${{ inputs.os_architecture }}" -or $env:RUNNER_ARCH -ne "${{ inputs.runner_arch }}") {
              throw "Runner architecture does not match the validation contract"
          }
      - name: Format
        if: inputs.run_format
        run: cargo fmt --all -- --check
      - name: Lint root package
        run: cargo clippy --locked -p agentshim --all-targets --all-features -- -D warnings
      - name: Test root package default features
        run: cargo test --locked -p agentshim --tests
      - name: Verify root all-features test targets compile
        run: cargo check --locked -p agentshim --all-features --tests
      - name: Test bench-internals profiled paths
        run: cargo test --locked -p agentshim --features bench-internals --lib -- profiled
      - name: Lint derivative packages
        if: steps.validation-scope.outputs.scope == 'full'
        run: cargo clippy --locked -p agentshim-pdf-read -p agentshim-gigatoken --all-targets --all-features -- -D warnings
      - name: Test derivative packages default features
        if: steps.validation-scope.outputs.scope == 'full'
        run: cargo test --locked -p agentshim-pdf-read -p agentshim-gigatoken --tests
      - name: Verify derivative all-features test targets compile
        if: steps.validation-scope.outputs.scope == 'full'
        run: cargo check --locked -p agentshim-pdf-read -p agentshim-gigatoken --all-features --tests
      - name: Check PDF rendering-only feature profile
        if: steps.validation-scope.outputs.scope == 'full'
        run: cargo check --locked -p agentshim-pdf-read --all-targets --no-default-features --features rendering
      - name: Build root package documentation
        if: inputs.build_docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked -p agentshim --all-features --no-deps
      - name: Build derivative package documentation
        if: inputs.build_docs && steps.validation-scope.outputs.scope == 'full'
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --locked -p agentshim-pdf-read -p agentshim-gigatoken --all-features --no-deps
      - name: Metadata
        if: inputs.run_metadata
        run: cargo metadata --locked --no-deps --format-version 1
