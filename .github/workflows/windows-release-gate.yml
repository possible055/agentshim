name: Windows 11 release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-11-ntfs:
    runs-on: [self-hosted, Windows, X64, codexshim-windows11-ntfs]
    steps:
      - uses: actions/checkout@v7
      - name: Validate environment
        shell: pwsh
        run: |
          $windows = [System.Environment]::OSVersion.Version
          $operatingSystem = Get-CimInstance Win32_OperatingSystem
          $drive = (Get-Location).Drive.Name
          $volume = Get-Volume -DriveLetter $drive -ErrorAction Stop
          if ($windows.Build -lt 22621) {
            throw "Windows build 22621 or newer is required; found $($windows.Build)"
          }
          if ($operatingSystem.ProductType -ne 1) {
            throw "A Windows workstation edition is required; found $($operatingSystem.Caption)"
          }
          if ($volume.FileSystem -ne "NTFS") {
            throw "NTFS is required; found $($volume.FileSystem) on drive $drive"
          }
          if ($volume.DriveType -ne "Fixed") {
            throw "A fixed drive is required; found $($volume.DriveType) on drive $drive"
          }
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
