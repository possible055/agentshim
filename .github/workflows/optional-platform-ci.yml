name: Optional platform CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate (standard excludes Linux x64 already required by CI)
        required: true
        default: all
        type: choice
        options:
          - all
          - standard
          - linux-x86-64
          - linux-arm64
          - macos-arm64
          - windows-arm64
          - macos-x86-64

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  linux-x86-64:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux-x86-64' }}
    name: Linux x86-64 CI
    uses: ./.github/workflows/rust-validation.yml
    with:
      runner: ubuntu-24.04
      platform: unix
      system: Linux
      machine: x86_64
      runner_arch: X64
      engine_only: true

  linux-arm64:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'standard' || inputs.platform == 'linux-arm64' }}
    name: Linux ARM64 CI
    uses: ./.github/workflows/rust-validation.yml
    with:
      runner: ubuntu-24.04-arm
      platform: unix
      system: Linux
      machine: aarch64
      runner_arch: ARM64
      engine_only: true

  macos-arm64:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'standard' || inputs.platform == 'macos-arm64' }}
    name: macOS ARM64 CI
    uses: ./.github/workflows/rust-validation.yml
    with:
      runner: macos-26
      platform: unix
      system: Darwin
      machine: arm64
      runner_arch: ARM64
      engine_only: true

  windows-arm64:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows-arm64' }}
    name: Windows ARM64 CI
    uses: ./.github/workflows/rust-validation.yml
    with:
      runner: windows-11-arm
      platform: windows
      runner_arch: ARM64
      os_architecture: Arm64
      engine_only: true

  macos-x86-64:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos-x86-64' }}
    name: macOS x86-64 CI
    uses: ./.github/workflows/rust-validation.yml
    with:
      runner: macos-15-intel
      platform: unix
      system: Darwin
      machine: x86_64
      runner_arch: X64
      engine_only: true
