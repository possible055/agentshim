name: Optional platform CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-arm64
          - macos-x86-64

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  windows-arm64:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows-arm64' }}
    name: Windows ARM64 CI
    uses: ./.github/workflows/rust-validation.yml
    with:
      runner: windows-11-arm
      platform: windows
      runner_arch: ARM64
      os_architecture: Arm64

  macos-x86-64:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos-x86-64' }}
    name: macOS x86-64 CI
    uses: ./.github/workflows/rust-validation.yml
    with:
      runner: macos-15-intel
      platform: unix
      system: Darwin
      machine: x86_64
      runner_arch: X64
      setup_node: false
