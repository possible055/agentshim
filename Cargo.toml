[workspace]
# Do not list "." here. Cargo matches members/exclude with Path::starts_with,
# so a "." member is the whole tree and disables exclude for nested checkouts.
members = ["crates/gigatoken-core", "crates/pdf-read-core"]
# Keep bare workspace-root Cargo commands aligned with the explicit CI package scope.
default-members = [".", "crates/gigatoken-core", "crates/pdf-read-core"]
# Nested checkouts and local-only trees are not members. Cargo matches exclude
# with Path::starts_with (not globs), so list directory prefixes, not `dir/*`.
exclude = ["repos", "local"]
resolver = "3"

[package]
name = "codexshim"
version = "0.1.4-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Capability-aware MCP repository tools for Codex"
autotests = true

[dependencies]
base64 = "=0.22.1"
cap-std = "=4.0.2"
chardetng = "=1.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
codexshim-pdf-read = { path = "crates/pdf-read-core" }
codexshim-gigatoken = { path = "crates/gigatoken-core" }
encoding_rs = "0.8.35"
globset = "0.4.16"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "=0.1.17"
ignore = "0.4.23"
rayon = "=1.11.0"
rmcp = { version = "=3.1.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.16"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["registry"] }
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.0", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.172"

[dev-dependencies]
log = "0.4.27"
tempfile = "3.20.0"

[features]
bench-internals = []

# Build artifacts live on a 24 GB RAM disk; full debug info dominated the budget
# (4.5 GB of .pdb across 17 test binaries). Keep file:line for backtraces, drop
# the rest. Override for a single build with CARGO_PROFILE_DEV_DEBUG=2.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[[bench]]
name = "performance"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "stdio_performance"
harness = false

[[test]]
name = "resource_soak"
test = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
