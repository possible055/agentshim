[package]
name = "codexshim"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Capability-aware MCP repository tools for Codex"

[dependencies]
cap-std = "=4.0.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8.35"
globset = "0.4.16"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "=0.1.17"
ignore = "0.4.23"
rmcp = { version = "=3.1.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.16"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["registry"] }
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.0", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.172"

[dev-dependencies]
tempfile = "3.20.0"

[features]
bench-internals = []

[[bench]]
name = "performance"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "stdio_performance"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
