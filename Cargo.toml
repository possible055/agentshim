[package]
name = "codexshim"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Capability-aware MCP repository tools for Codex"

[dependencies]
bpe-openai = "0.3.0"
cap-std = "=4.0.2"
encoding_rs = "0.8.35"
globset = "0.4.16"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "=0.1.17"
ignore = "0.4.23"
rmcp = { version = "=3.1.0", features = ["server", "transport-io"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.0", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.172"

[dev-dependencies]
tempfile = "3.20.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
