minimum_pre_commit_version: "4.5.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        name: Repository / YAML syntax
      - id: check-toml
        name: Repository / TOML syntax
      - id: check-json
        name: Repository / JSON syntax
      - id: end-of-file-fixer
        name: Repository / Final newline
        stages: [pre-commit]
      - id: trailing-whitespace
        name: Repository / Trailing whitespace
        stages: [pre-commit]
      - id: mixed-line-ending
        name: Repository / Line endings
      - id: check-added-large-files
        name: Repository / Large files
        args: ["--maxkb=5000"]
        stages: [pre-commit]
      - id: check-merge-conflict
        name: Repository / Merge conflict markers
      - id: check-case-conflict
        name: Repository / Case conflicts
      - id: check-shebang-scripts-are-executable
        name: Repository / Executable scripts
        exclude: '\.rs$'
        stages: [pre-commit]
      - id: detect-private-key
        name: Repository / Private keys

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        name: Repository / Staged secrets
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-format
        name: Repository / Python format
        types: [python]
      - id: ruff-check
        name: Repository / Python lint
        args: ["--fix"]
        types: [python]

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        name: Repository / Spelling
        # The upstream hook defaults to --write-changes, which silently
        # applies single-suggestion corrections inside string literals and
        # data assets. Check-only; corrections are applied deliberately.
        args: [--force-exclude]

  - repo: local
    hooks:
      - id: hook-output-tests
        name: Repository / Hook self-tests
        entry: python3 -m unittest discover -s scripts -p test_hooks.py
        language: system
        files: '^scripts/(hooks/(pre-commit|pre-push)|check-test-sleeps\.sh|test_hooks\.py)$'
        pass_filenames: false

      - id: uv-lock-check
        name: Repository / Python dependency lock
        entry: uv lock --locked
        language: system
        files: '(pyproject\.toml|uv\.lock)$'
        pass_filenames: false

      - id: contract-snapshot-check
        name: Repository / Contract snapshots current
        entry: python3
        args: ["scripts/generate-contracts.py", "--check"]
        language: system
        files: '^(contracts/|scripts/generate-contracts\.py$)'
        pass_filenames: false

      - id: proc-stat-eval-tests
        name: Evals / proc_stat parser self-tests
        # runpy keeps the repository root as the import base for the evals.* import.
        entry: python3
        args:
          [
            "-c",
            'import runpy; runpy.run_path("evals/framework/monitor/test_proc_stat.py", run_name="__main__")',
          ]
        language: system
        files: '^evals/framework/monitor/'
        pass_filenames: false

      - id: mypy
        name: Repository / Python typecheck
        entry: uv run --frozen --group dev -- mypy
        language: system
        args:
          [
            "--config-file=pyproject.toml",
            "--no-error-summary",
            "evals",
            "scripts",
          ]
        files: '^(evals/.*\.py|scripts/.*\.py|pyproject\.toml)$'
        pass_filenames: false
        require_serial: true

      - id: cargo-fmt
        name: Rust / Format
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-clippy
        name: Rust / Compiler and Clippy warnings (workspace)
        entry: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-structural-audit
        name: Rust / Cognitive complexity
        entry: >-
          cargo clippy --locked -p agentshim -p agentshim-core -p agentshim-napi
          -p agentshim-gigatoken --lib --bins --no-deps -- -W clippy::cognitive-complexity
        language: system
        pass_filenames: false
        always_run: true

      - id: dsh-lint
        name: DSH / Lint
        entry: pnpm --dir adapters/dsh lint
        language: system
        files: '^adapters/dsh/(?:.*\.[cm]?[jt]sx?|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig(?:\.build)?\.json)$'
        pass_filenames: false

      - id: dsh-typecheck
        name: DSH / Typecheck
        entry: pnpm --dir adapters/dsh typecheck
        language: system
        files: '^adapters/dsh/(?:.*\.[cm]?[jt]sx?|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig(?:\.build)?\.json)$'
        pass_filenames: false

      - id: dsh-build
        name: DSH / Production build and types
        entry: pnpm --dir adapters/dsh build
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: cargo-clippy-linux
        name: Rust / Linux Clippy (workspace)
        entry: >-
          bash -c 'if [ "$(uname -s)" = Linux ]; then
          exec cargo clippy --locked --target x86_64-unknown-linux-gnu
          --workspace --all-targets --all-features -- -D warnings;
          fi'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: cargo-test
        name: Rust / Workspace unit, contract and integration tests
        entry: cargo nextest run --locked --retries 2 --flaky-result fail --workspace
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: dsh-test
        name: DSH / Unit tests
        entry: pnpm --dir adapters/dsh test:unit
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: cargo-machete
        name: Rust / Unused dependencies
        entry: cargo machete
        language: system
        stages: [pre-push]
        files: '(^|/)Cargo\.(toml|lock)$'
        pass_filenames: false

      - id: cargo-deny
        name: Rust / Dependency policy
        entry: cargo deny --locked check advisories bans licenses sources
        language: system
        stages: [pre-push]
        files: '(^|/)(Cargo\.(toml|lock)|deny\.toml)$'
        pass_filenames: false
