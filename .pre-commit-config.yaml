minimum_pre_commit_version: "4.5.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
        exclude: '\.rs$'
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-format
        types: [python]
      - id: ruff-check
        args: ["--fix"]
        types: [python]

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        # The upstream hook defaults to --write-changes, which silently
        # applies single-suggestion corrections inside string literals and
        # data assets. Check-only; corrections are applied deliberately.
        args: [--force-exclude]

  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --locked
        language: system
        files: '(pyproject\.toml|uv\.lock)$'
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run --frozen --group dev -- mypy
        language: system
        args:
          [
            "--config-file=pyproject.toml",
            "--no-error-summary",
            "evals",
            "scripts",
          ]
        files: '^(evals/.*\.py|scripts/.*\.py|pyproject\.toml)$'
        pass_filenames: false
        require_serial: true

      - id: dsh-lint
        name: DSH adapter lint
        entry: pnpm --dir adapters/dsh lint
        language: system
        files: '^adapters/dsh/(?:.*\.[cm]?[jt]sx?|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig(?:\.build)?\.json)$'
        pass_filenames: false

      - id: dsh-typecheck
        name: DSH adapter typecheck
        entry: pnpm --dir adapters/dsh typecheck
        language: system
        files: '^adapters/dsh/(?:.*\.[cm]?[jt]sx?|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig(?:\.build)?\.json)$'
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        files: '^(Cargo\.(toml|lock)|rust-toolchain\.toml|src/.*\.rs|crates/.*\.(rs|toml)|tests/.*\.rs|benches/.*\.rs)$'
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        files: '^(Cargo\.(toml|lock)|rust-toolchain\.toml|src/.*\.rs|crates/.*\.(rs|toml)|tests/.*\.rs|benches/.*\.rs)$'
        pass_filenames: false

      - id: cargo-machete
        name: cargo machete
        entry: cargo machete
        language: system
        files: '(^|/)Cargo\.(toml|lock)$'
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --locked --tests
        language: system
        stages: [pre-push]
        files: '^(Cargo\.(toml|lock)|rust-toolchain\.toml|src/.*\.rs|crates/.*\.(rs|toml)|tests/.*\.rs)$'
        pass_filenames: false
