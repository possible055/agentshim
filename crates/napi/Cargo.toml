[package]
name = "agentshim-napi"
version = "0.1.4-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Native agentshim engine for in-process DSH hosts"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
agentshim-core = { path = "../core" }
base64 = "=0.22.1"
napi = { version = "=3.12.1", default-features = false, features = ["napi8", "async", "tokio_rt", "error_anyhow", "serde-json"] }
napi-derive = "=3.6.3"
serde_json = "1.0.142"
uuid = { version = "1.24.0", features = ["v4"] }
tokio-util = "0.7.16"
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }

[build-dependencies]
napi-build = "=2.4.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# napi hands numbers over as f64 and strings by value; byte counts and argv are
# therefore structurally cast at the boundary.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
needless_pass_by_value = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
