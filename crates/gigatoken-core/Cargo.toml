[package]
name = "codexshim-gigatoken"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
autotests = true

[[test]]
name = "performance"
test = false

[dependencies]
base64 = "=0.22.1"
rustc-hash = "2.1.1"
sha2 = "0.10.9"
thiserror = "2.0.12"
unicode-general-category = "1.1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
